name: Sync from Nimvelis upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nimvelis-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Validate and merge upstream
    if: github.repository != 'chatgptuk/nimvelis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPOSITORY: https://github.com/chatgptuk/nimvelis.git
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out downstream repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Fetch and prepare upstream merge
        id: merge
        shell: bash
        run: |
          git remote add nimvelis-upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags nimvelis-upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "nimvelis-upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "This repository already contains the latest Nimvelis changes."
            exit 0
          fi

          git config user.name "nimvelis-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "nimvelis-upstream/$UPSTREAM_BRANCH"

          # GITHUB_TOKEN cannot safely update workflow definitions. Keep the
          # downstream repository's workflows and sync them manually when needed.
          if [[ -d .github/workflows ]]; then
            git restore --source=HEAD --staged --worktree .github/workflows
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install merged dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Validate merged application
        if: steps.merge.outputs.changed == 'true'
        run: npm run check

      - name: Commit and push upstream changes
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          git commit -m "Merge Nimvelis upstream"
          git push origin "HEAD:$TARGET_BRANCH"
